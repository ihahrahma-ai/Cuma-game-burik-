<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Troll Adventure 3.0</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#10182b;
 color:white;
 text-align:center;
 font-family:Arial;
}
h2{margin:12px}
#info{padding:10px}
canvas{
 width:100%;
 max-width:850px;
 display:block;
 margin:auto;
 border:3px solid white;
 border-radius:12px;
 touch-action:none;
}
.controls{
 display:flex;
 justify-content:center;
 gap:15px;
 margin:15px;
}
button{
 padding:16px 25px;
 border:0;
 border-radius:15px;
 background:#ffc936;
 font-size:24px;
 font-weight:bold;
 touch-action:none;
}
</style>
</head>
<body>

<h2>🍄 TROLL ADVENTURE 3.0</h2>
<div id="info">LEVEL 1 | ❤️ 3 | 🪙 0</div>
<canvas id="game" width="850" height="430"></canvas>

<button id="sound">🔊 SOUND ON</button>

<div class="controls">
<button id="left">⬅️</button>
<button id="jump">⬆️</button>
<button id="right">➡️</button>
</div>

<script>
const c=document.getElementById("game");
const ctx=c.getContext("2d");

let level=1,lives=3,score=0;
let camera=0,targetCamera=0;
let keys={};
let gameOver=false;
let soundOn=true;
let audio=null;
let time=0;
let particles=[];
let platforms=[],traps=[],coins=[];
let goal=0;

const player={
 x:50,y:300,w:30,h:42,
 vx:0,vy:0,ground:false,
 frame:0,facing:1,
 squash:0
};

function beep(f,d=.12){
 if(!soundOn)return;
 if(!audio)audio=new AudioContext();
 if(audio.state==="suspended")audio.resume();
 let o=audio.createOscillator();
 let g=audio.createGain();
 o.frequency.value=f;
 g.gain.value=.06;
 o.connect(g);g.connect(audio.destination);
 o.start();
 g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);
 o.stop(audio.currentTime+d);
}

function makeLevel(){
 platforms=[];traps=[];coins=[];particles=[];
 gameOver=false;
 camera=0;targetCamera=0;

 player.x=50;player.y=300;
 player.vx=0;player.vy=0;
 player.ground=false;
 player.squash=0;

 let length=1900+level*160;
 goal=length-100;

 platforms.push({x:0,y:370,w:length,h:60});

 for(let x=240;x<goal-100;x+=160){
  let y=290-Math.random()*90;

  platforms.push({
   x,y,w:90,h:18,
   troll:Math.random()<.35,
   used:false
  });

  if(Math.random()<.5){
   traps.push({x:x+100,y:342,w:30,h:28});
  }

  if(Math.random()<.3){
   coins.push({x:x+40,y:y-40,taken:false});
  }
 }
}

function collision(a,b){
 return a.x<b.x+b.w&&
 a.x+a.w>b.x&&
 a.y<b.y+b.h&&
 a.y+a.h>b.y;
}

function burst(x,y,color){
 for(let i=0;i<12;i++){
  particles.push({
   x,y,
   vx:(Math.random()-.5)*7,
   vy:(Math.random()-.5)*7,
   life:35,color
  });
 }
}

function die(){
 if(gameOver)return;
 gameOver=true;
 beep(130,.3);
 lives--;
 burst(player.x,player.y,"red");

 setTimeout(()=>{
  if(lives<=0){
   alert("GAME OVER 😂");
   lives=3;level=1;score=0;
  }
  makeLevel();
 },500);
}

function nextLevel(){
 gameOver=true;
 beep(700);
 setTimeout(()=>beep(900),150);
 level++;
 if(level>20){
  alert("🏆 KAMU MENANG!");
  level=1;lives=3;score=0;
 }
 makeLevel();
}

function update(dt){
 time+=dt;

 if(!gameOver){

  // Gerakan smooth
  let direction=0;
  if(keys.left)direction=-1;
  if(keys.right)direction=1;

  if(direction!==0){
   player.facing=direction;
   player.vx+=(direction*4.5-player.vx)*Math.min(1,dt*.018);
   player.frame+=dt*.012;
  }else{
   player.vx*=Math.pow(.82,dt/16.67);
  }

  if(keys.jump&&player.ground){
   player.vy=-12;
   player.ground=false;
   player.squash=-.25;
   beep(450);
  }

  player.vy+=.55*dt/16.67;
  player.vy=Math.min(player.vy,13);

  player.x+=player.vx*dt/16.67;
  player.y+=player.vy*dt/16.67;

  let wasGround=player.ground;
  player.ground=false;

  for(let p of platforms){
   if(collision(player,p)&&player.vy>=0){
    if(player.y+player.h-player.vy*dt/16.67<=p.y+10){
     player.y=p.y-player.h;
     player.vy=0;
     player.ground=true;

     if(!wasGround)player.squash=.3;

     if(p.troll&&!p.used){
      p.used=true;
      setTimeout(()=>p.y+=140,200);
     }
    }
   }
  }

  for(let t of traps){
   if(collision(player,t)){
    die();return;
   }
  }

  for(let coin of coins){
   if(!coin.taken&&collision(player,{
    x:coin.x-10,y:coin.y-10,w:20,h:20
   })){
    coin.taken=true;
    score++;
    beep(950);
    burst(coin.x,coin.y,"gold");
   }
  }

  if(player.y>460){die();return}
  if(player.x>=goal){nextLevel()}

  targetCamera=Math.max(0,player.x-350);

  // Kamera smoothing
  camera+=(targetCamera-camera)*Math.min(1,dt*.009);
 }

 player.squash*=Math.pow(.82,dt/16.67);

 for(let p of particles){
  p.x+=p.vx*dt/16.67;
  p.y+=p.vy*dt/16.67;
  p.vy+=.2*dt/16.67;
  p.life-=dt/16.67;
 }

 particles=particles.filter(p=>p.life>0);

 document.getElementById("info").innerText=
 "LEVEL "+level+" | ❤️ "+lives+" | 🪙 "+score;
}

function drawBackground(){
 let g=ctx.createLinearGradient(0,0,0,430);
 g.addColorStop(0,"#42bdf5");
 g.addColorStop(1,"#c7f3ff");
 ctx.fillStyle=g;
 ctx.fillRect(0,0,850,430);

 // Matahari
 ctx.fillStyle="#fff4a5";
 ctx.beginPath();
 ctx.arc(700,75,40,0,7);
 ctx.fill();

 // Gunung bergerak
 for(let i=0;i<7;i++){
  let x=i*180-(camera*.2)%180;
  ctx.fillStyle="#79c99b";
  ctx.beginPath();
  ctx.moveTo(x,370);
  ctx.lineTo(x+90,160);
  ctx.lineTo(x+180,370);
  ctx.fill();
 }

 // Awan bergerak
 for(let i=0;i<6;i++){
  let x=(i*190-time*.025-camera*.3)%1050;
  if(x<0)x+=1050;
  ctx.fillStyle="white";
  ctx.beginPath();
  ctx.arc(x,90,22,0,7);
  ctx.arc(x+25,80,27,0,7);
  ctx.arc(x+55,95,20,0,7);
  ctx.fill();
 }
}

function drawPlayer(){
 ctx.save();

 let bounce=player.ground?
 Math.sin(player.frame)*2:0;

 let sx=1+player.squash;
 let sy=1-player.squash;

 ctx.translate(
  player.x+15,
  player.y+21+bounce
 );

 ctx.scale(sx,sy);
 ctx.scale(player.facing,1);

 // Bayangan
 ctx.fillStyle="rgba(0,0,0,.2)";
 ctx.beginPath();
 ctx.ellipse(0,23,17,5,0,0,7);
 ctx.fill();

 // Kaki animasi
 let leg=player.ground?
 Math.sin(player.frame)*5:0;

 ctx.fillStyle="#57351f";
 ctx.fillRect(-12,13+leg,10,9);
 ctx.fillRect(3,13-leg,10,9);

 // Badan
 ctx.fillStyle="#e83b3b";
 ctx.fillRect(-12,-8,24,25);

 // Wajah
 ctx.fillStyle="#ffd0a0";
 ctx.fillRect(-10,-21,21,18);

 // Topi
 ctx.fillStyle="#c92323";
 ctx.fillRect(-15,-25,30,8);
 ctx.fillRect(-8,-32,21,9);

 // Mata
 ctx.fillStyle="#222";
 ctx.fillRect(5,-17,4,5);

 ctx.restore();
}

function draw(){
 drawBackground();

 ctx.save();
 ctx.translate(-camera,0);

 // Platform
 for(let p of platforms){
  ctx.fillStyle="#96502c";
  ctx.fillRect(p.x,p.y,p.w,p.h);
  ctx.fillStyle="#3bd45d";
  ctx.fillRect(p.x,p.y,p.w,9);
 }

 // Jebakan
 for(let t of traps){
  ctx.fillStyle="#dc3434";
  ctx.beginPath();
  ctx.moveTo(t.x,t.y+t.h);
  ctx.lineTo(t.x+t.w/2,t.y);
  ctx.lineTo(t.x+t.w,t.y+t.h);
  ctx.fill();
 }

 // Koin berputar
 for(let coin of coins){
  if(coin.taken)continue;
  let width=Math.abs(Math.cos(time*.005))*7+2;
  ctx.fillStyle="#ffd52e";
  ctx.beginPath();
  ctx.ellipse(coin.x,coin.y,width,12,0,0,7);
  ctx.fill();
 }

 // Finish
 ctx.fillStyle="white";
 ctx.fillRect(goal,190,6,180);
 ctx.fillStyle="red";
 ctx.fillRect(goal+6,190,65,35);

 // Partikel
 for(let p of particles){
  ctx.globalAlpha=Math.max(0,p.life/35);
  ctx.fillStyle=p.color;
  ctx.fillRect(p.x,p.y,6,6);
 }
 ctx.globalAlpha=1;

 drawPlayer();
 ctx.restore();
}

let last=performance.now();

function loop(now){
 let dt=Math.min(now-last,40);
 last=now;
 update(dt);
 draw();
 requestAnimationFrame(loop);
}

function control(id,key){
 let b=document.getElementById(id);
 b.addEventListener("pointerdown",e=>{
  e.preventDefault();
  keys[key]=true;
 });
 ["pointerup","pointerleave","pointercancel"].forEach(ev=>{
  b.addEventListener(ev,()=>keys[key]=false);
 });
}

control("left","left");
control("right","right");
control("jump","jump");

document.addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft")keys.left=true;
 if(e.key==="ArrowRight")keys.right=true;
 if(e.key===" "||e.key==="ArrowUp")keys.jump=true;
});

document.addEventListener("keyup",e=>{
 if(e.key==="ArrowLeft")keys.left=false;
 if(e.key==="ArrowRight")keys.right=false;
 if(e.key===" "||e.key==="ArrowUp")keys.jump=false;
});

document.getElementById("sound").onclick=()=>{
 soundOn=!soundOn;
 document.getElementById("sound").innerText=
 soundOn?"🔊 SOUND ON":"🔇 SOUND OFF";
};

makeLevel();
requestAnimationFrame(loop);
</script>
</body>
</html>
